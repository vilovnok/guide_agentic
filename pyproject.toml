[project]
name = "guide_agentic"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-gigachat>=0.5.1",
    "langchain-openai>=1.6.2",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.46.0",
    "pydantic-ai-slim[duckduckgo]>=2.46.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chat_loop", "tool", "skills", "persistence"]

[project.scripts]
chat_loop = "chat_loop.cli.main:app"
tool = "tool.cli.main:app"
skills = "skills.cli.main:app"
persistence = "persistence.cli.main:app"
